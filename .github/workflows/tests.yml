# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:

    runs-on: ubuntu-latest

    env:
      # Webpacker 5's webpack 4 hashes with md4, which Node 17+ only allows
      # through OpenSSL's legacy provider.
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
    - uses: actions/checkout@v2
    - name: Install native dependencies
      run: sudo apt-get update && sudo apt-get install -y libmagickwand-dev
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Set up Node
      uses: actions/setup-node@v1
      with:
        node-version: 20.19.5 # keep in step with the production server
    - name: Compile JS
      run: RAILS_ENV=test bundle exec rake assets:precompile
    - name: Run tests
      run: RAILS_ENV=test bundle exec rails test
